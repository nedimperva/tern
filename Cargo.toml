[workspace]
resolver = "2"
members = ["crates/tern-core", "crates/imap-probe", "src-tauri"]

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"

# Debug builds: line numbers for Tern's own code (panics and backtraces still point at the line), no debug info
# for dependencies. Windows .pdb files had grown target/ past 11 GB; this keeps builds as fast and far smaller.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# SQLite unoptimised made every list query in a dev build take 150-200 ms against a real mailbox (release: a few
# ms), so the slow-query warning fired on each move. Optimising just these two costs one rebuild of them.
[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.rusqlite]
opt-level = 3
