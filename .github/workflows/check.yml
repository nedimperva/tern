name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libssl-dev pkg-config

      # rust-toolchain.toml picks the channel and components.
      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # The Tauri shell embeds dist/ at compile time, so the frontend builds first.
      - name: Frontend build
        run: |
          npm ci
          npm run build

      - name: rustfmt
        if: runner.os == 'Linux'
        run: cargo fmt --all --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: tests
        run: cargo test --workspace

      # The speed table at 100,000 messages. Shared runners vary from run to run, so targets get 3x: this catches
      # regressions of several times; the reference numbers come from the Omarchy laptop.
      - name: store_bench
        if: runner.os == 'Linux'
        env:
          TERN_BENCH_SLACK: "3"
        run: cargo run --release -p tern-core --example store_bench
