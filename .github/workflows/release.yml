name: release

# Pushing a tag like v0.2.0 builds the installers and attaches them to a draft GitHub release, with that
# version's section of CHANGELOG.md as its notes. The draft stays hidden until the owner publishes it. A PR that
# changes this file only builds, so the installers can be tried from the run's artifacts before anything is tagged.
#
# The updater artifacts (signed AppImage and NSIS installer, latest.json) need the TAURI_SIGNING_PRIVATE_KEY and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD secrets. Installed copies look for latest.json on the newest release that
# is neither a draft nor a pre-release, so a release reaches them when it is published.
# "Continue with Google" needs the TERN_GOOGLE_CLIENT_ID and TERN_GOOGLE_CLIENT_SECRET secrets (the Google Cloud
# desktop client; see src-tauri/build.rs). Without them the build still works and Gmail takes an app password.
#
# One job makes the draft and the builds upload into it by id: left to find it by tag, each build made a draft
# of its own (a draft has no tag yet), each with a latest.json for its platform alone. The builds take turns so
# the second adds its platforms to latest.json instead of racing the first, and a last job checks it is whole.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.draft.outputs.id }}
    steps:
      - uses: actions/checkout@v7

      # A tag without its CHANGELOG.md section, or one that doesn't match package.json, fails here, before
      # anything is built.
      - name: Release notes
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          notes=$(awk -v v="[$version]" '/^## \[/ { on = index($0, v) == 4; next } /^\[.*\]: / { next } on' CHANGELOG.md)
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          {
            echo "$notes"
            echo
            echo '### Install'
            echo
            echo 'Linux: the `.AppImage` runs as is and updates itself; `.deb` and `.rpm` install with the system'"'"'s package'
            echo 'tool, and on Arch `yay -S tern-bin`.'
            echo 'Windows: download the `-setup.exe` and run it. The installer isn'"'"'t signed yet, so Windows may show'
            echo '"Windows protected your PC": choose More info, then Run anyway.'
          } > "$RUNNER_TEMP/notes.md"

      - name: Draft release
        id: draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Tern $GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md"
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.draft and .tag_name == \"$GITHUB_REF_NAME\")][0].id")
          echo "id=$id" >> "$GITHUB_OUTPUT"

  build:
    needs: release
    # Runs without the release job too: a PR or a manual run only builds.
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      # One at a time: each adds its platforms to the draft's latest.json, and two at once would lose one.
      max-parallel: 1
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # 22.04 keeps the AppImage and .deb working on older glibc than the build machine's.
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libssl-dev pkg-config

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TERN_GOOGLE_CLIENT_ID: ${{ secrets.TERN_GOOGLE_CLIENT_ID }}
          TERN_GOOGLE_CLIENT_SECRET: ${{ secrets.TERN_GOOGLE_CLIENT_SECRET }}
        with:
          # Empty outside a tag, so the build only builds.
          releaseId: ${{ needs.release.outputs.id }}
          # Only release builds sign updates, so a local `tauri build` needs no key.
          args: '--config {"bundle":{"createUpdaterArtifacts":true}}'
          # Windows updates through the NSIS installer, which the updater runs without questions.
          updaterJsonPreferNsis: true

      - name: Keep the installers from a test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: tern-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/**/*.sig

  # The draft is only worth publishing when latest.json names every platform and each file it points at is in the
  # release: an installed copy whose platform is missing never hears of the update.
  check:
    needs: [release, build]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    steps:
      - name: latest.json covers every platform
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ID: ${{ needs.release.outputs.id }}
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/$ID")
          json_id=$(jq -r '.assets[] | select(.name == "latest.json") | .id' <<<"$release")
          [ -n "$json_id" ] || { echo "::error::the draft has no latest.json"; exit 1; }
          gh api -H 'Accept: application/octet-stream' "repos/$GITHUB_REPOSITORY/releases/assets/$json_id" > latest.json
          status=0
          for p in linux-x86_64 linux-x86_64-appimage linux-x86_64-deb linux-x86_64-rpm \
                   windows-x86_64 windows-x86_64-nsis windows-x86_64-msi; do
            url=$(jq -r --arg p "$p" '.platforms[$p].url // empty' latest.json)
            if [ -z "$url" ]; then
              echo "::error::latest.json has no $p"; status=1
            elif ! jq -e --arg u "$url" 'any(.assets[]; .url == $u)' <<<"$release" >/dev/null; then
              echo "::error::latest.json points $p at $url, which isn't in this release"; status=1
            fi
          done
          exit $status
