name: release

# Pushing a tag like v0.2.0 builds the installers and attaches them to a draft GitHub release.
# The draft stays hidden until the owner publishes it. A PR that changes this file only builds, so the
# installers can be tried from the run's artifacts before anything is tagged.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [".github/workflows/release.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # 22.04 keeps the AppImage and .deb working on older glibc than the build machine's.
      - name: Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libdbus-1-dev libssl-dev pkg-config

      - name: Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && 'v__VERSION__' || '' }}
          releaseName: Tern v__VERSION__
          releaseBody: |
            Windows: download the `-setup.exe` and run it. The installer isn't signed yet, so Windows may show
            "Windows protected your PC": choose More info, then Run anyway.
            Linux: the `.AppImage` runs as is; `.deb` and `.rpm` install with the system's package tool.
          releaseDraft: true
          prerelease: true

      - name: Keep the installers from a test build
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          name: tern-${{ runner.os }}
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
