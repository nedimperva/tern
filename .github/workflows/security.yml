name: security

# Known-vulnerability checks for the Rust and npm dependencies, cargo deny (licences, sources), plus CodeQL code
# scanning.
# Runs weekly too, because new advisories appear without any change here.
on:
  push:
    branches: [main]
  pull_request:
    paths: ["Cargo.lock", "**/Cargo.toml", "deny.toml", "package-lock.json", ".github/workflows/security.yml"]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      # Unmaintained/unsound warnings come from the GTK stack Tauri needs on Linux; only real
      # vulnerabilities fail the job.
      - name: cargo audit
        run: cargo audit

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: npm audit
        run: npm audit --omit=dev --audit-level=moderate

  # Licences, bans and sources from deny.toml, and advisories again with cargo deny's own rules.
  deny:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, rust, actions]
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
