# Licences the app's Rust dependencies may use; `scripts/third-party.sh` writes THIRD_PARTY.md from them. All are
# permissive, or MPL-2.0 (file-level: fine for crates Tern uses unchanged, whose source stays on crates.io).
accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "MIT-0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
]
# Only what the app is built from on the platforms it ships for.
targets = ["x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
