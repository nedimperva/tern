[package]
name = "tern"
version = "1.3.0"
edition = "2021"
license = "MIT"
description = "Tern mail"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
anyhow = "1"
tern-core = { path = "../crates/tern-core" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["sync", "time"] }
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
# Local time for quiet hours (already in the tree through io-imap).
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# No `zip`: release updates are a plain AppImage and an NSIS .exe, and zip 4 carries open advisories.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }

# Notifications: the desktop's notification service on Linux, toasts that report clicks on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Data_Xml_Dom", "Foundation", "UI_Notifications"] }
