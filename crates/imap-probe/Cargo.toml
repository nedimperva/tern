[package]
name = "imap-probe"
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false
description = "Package 01 decision gate: the same IMAP checks with async-imap and io-imap. Not shipped."

[dependencies]
anyhow = "1"
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }
base64 = "0.22"
futures = "0.3"
io-imap = "0.7"
io-sasl = { version = "0.1", default-features = false }
# io-imap 0.7.1 does not build from a fresh resolve: imap-codec turns off nom's default features and nothing
# turns `alloc` back on. Enabling it here is the workaround.
nom = { version = "8", features = ["alloc"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
